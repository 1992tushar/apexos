{% extends "base.html" %}
{% import "_macros.html" as ui %}
{% import "_preorder.html" as pre %}
{% block title %}New purchase order{% endblock %}
{% block content %}
{% call ui.page_header("New purchase order") %}
  <a class="btn" href="/purchase-orders">← All POs</a>
{% endcall %}

<div class="card">
  <form method="post" action="/purchase-orders">
    <div class="form-grid">
      <div class="field">
        <label>Supplier</label>
        <select name="supplier_id" required>
          {% for s in suppliers %}
            <option value="{{ s.id }}"{% if preselect and preselect == s.id | string %} selected{% endif %}>{{ s.name }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field"><label>Order date</label><input name="order_date" type="date" /></div>
    </div>

    {# R4.12: type the SKU instead of hunting a 311-option <select>. The buy price
       comes from the supplier's purchase price, so there is nothing to retype. #}
    {{ pre.line_grid(products, rows, autofocus=true) }}
    <p class="muted">Buy price defaults to this supplier's purchase price. Revise the PO to change it.</p>
    <div class="form-actions"><button class="btn btn-primary" type="submit">Create PO</button></div>
  </form>
</div>
{% endblock %}
