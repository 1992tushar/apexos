{% extends "base.html" %}
{% import "_macros.html" as ui %}
{% block title %}New purchase order{% endblock %}
{% block content %}
{% call ui.page_header("New purchase order") %}
  <a class="btn" href="/purchase-orders">← All POs</a>
{% endcall %}

<div class="card">
  <form method="post" action="/purchase-orders">
    <div class="form-grid">
      <div class="field">
        <label>Supplier</label>
        <select name="supplier_id" required>
          {% for s in suppliers %}<option value="{{ s.id }}">{{ s.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="field"><label>Order date</label><input name="order_date" type="date" /></div>
    </div>

    <div class="section-title mt">Lines</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr><th>Product</th><th class="num">Qty</th><th class="num">Unit price (₹)</th></tr>
        </thead>
        <tbody>
          {% for i in rows %}
          <tr>
            <td>
              <select name="product_id">
                <option value="">—</option>
                {% for p in products %}<option value="{{ p.id }}">{{ p.sku_code }} — {{ p.name }}</option>{% endfor %}
              </select>
            </td>
            <td class="num"><input name="qty" type="number" step="0.01" min="0" /></td>
            <td class="num"><input name="unit_price_rupees" type="number" step="0.01" min="0" /></td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
    <div class="form-actions"><button class="btn btn-primary" type="submit">Create PO</button></div>
  </form>
</div>
{% endblock %}
