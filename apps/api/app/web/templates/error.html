{% extends "base.html" %}
{% block title %}{{ code or "Error" }}{% endblock %}
{% block content %}
<div class="empty-state">
  <h1 style="margin:0 0 8px; font-size:20px;">{{ code or "Something went wrong" }}</h1>
  <p class="muted">{{ message or "The requested resource could not be found." }}</p>
  <p class="mt"><a class="btn" href="/">Back to dashboard</a></p>
</div>
{% endblock %}
