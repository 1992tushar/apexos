services:
  api:
    build:
      context: ./apps/api
    container_name: apexos-api
    environment:
      APP_ENV: dev
      # SQLite lives in a file inside the container's working dir — no DB server.
      DATABASE_URL: sqlite:///./apexos.db
      CORS_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"
    command: >
      sh -c "python -m app.seed &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"
